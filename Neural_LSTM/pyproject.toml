[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dos-detector"
version = "0.1.0"
description = "CPU-optimized LSTM-based DoS detector"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SDN AI Team" }
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.2",
    "pyarrow>=16.0.0",
    "psutil>=5.9",
    "PyYAML>=6.0.1",
    "scapy>=2.5.0",
    "structlog>=23.1",
    "tqdm>=4.66",
    "typer[all]>=0.9",
    "shap>=0.41",
]

[tool.setuptools.packages.find]
where = ["src"]
